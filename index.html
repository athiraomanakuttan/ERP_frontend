<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>EMS - Employee Management System</title>
    <script>
      // Applied before React mounts, so there is no flash of the wrong theme on load.
      (function () {
        try {
          var mode = localStorage.getItem('ems_theme_mode');
          if (!mode) mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (mode === 'dark') document.documentElement.classList.add('dark');

          var cachedColor = localStorage.getItem('ems_theme_color');
          if (cachedColor) document.documentElement.setAttribute('data-cached-primary', cachedColor);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
